# Whisper Tiny Fine-tuning Configuration for Hindi

# Model configuration
model:
  name: "openai/whisper-tiny"
  language: "hindi"
  task: "transcribe"

# Data configuration
data:
  train_manifest: "data/manifests/hindi_train.json"
  val_manifest: "data/manifests/hindi_val.json"
  test_manifest: "data/manifests/hindi_test.json"
  sample_rate: 16000
  num_workers: 4
  pin_memory: true

# Training configuration
training:
  output_dir: "models/whisper_hindi"
  num_epochs: 25
  batch_size: 16  # Adjust based on GPU memory
  gradient_accumulation_steps: 4  # Effective batch size = 64
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  max_grad_norm: 1.0

  # Mixed precision training
  fp16: true

  # Evaluation
  eval_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "wer"
  greater_is_better: false

  # Logging
  logging_steps: 100
  report_to: ["tensorboard", "wandb"]

  # Early stopping
  early_stopping_patience: 5
  early_stopping_threshold: 0.01

# Optimizer configuration
optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-8

# Scheduler configuration
scheduler:
  type: "linear"
  warmup_ratio: 0.1

# Data augmentation
augmentation:
  speed_perturbation:
    enabled: true
    rates: [0.9, 1.0, 1.1]

  noise_augmentation:
    enabled: true
    snr_range: [10, 20]
    noise_types: ["white", "pink"]

  spec_augment:
    enabled: true
    freq_mask_param: 15
    time_mask_param: 35
    num_freq_masks: 2
    num_time_masks: 2

# Generation configuration (for evaluation)
generation:
  max_length: 225
  num_beams: 5
  length_penalty: 1.0
  early_stopping: true

# Compute configuration
compute:
  device: "cuda"
  num_gpus: 1
  distributed: false

# Weights & Biases configuration
wandb:
  project: "whisper-hindi-finetuning"
  name: "whisper-tiny-hindi-v1"
  tags: ["whisper", "hindi", "tiny", "phase1"]
  notes: "Fine-tuning Whisper Tiny for Hindi ASR - Phase 1 MVP"

# Seed for reproducibility
seed: 42
